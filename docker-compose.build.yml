services:
  # One-shot site build: src/ -> _site/ (served by nginx in `make start`).
  build:
    build:
      context: .
      dockerfile: Dockerfile.lint
    volumes:
      - .:/app
      - /app/node_modules
    command: bun run build

  # Eleventy dev server: rebuilds and live-reloads on every change to the mounted source.
  dev:
    build:
      context: .
      dockerfile: Dockerfile.lint
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    command: bun run dev

  lint-js:
    build:
      context: .
      dockerfile: Dockerfile.lint
    volumes:
      - .:/app
      - /app/node_modules
    command: bun run lint:js

  lint-css:
    build:
      context: .
      dockerfile: Dockerfile.lint
    volumes:
      - .:/app
      - /app/node_modules
    command: bun run lint:css

  lint-html:
    build:
      context: .
      dockerfile: Dockerfile.lint
    volumes:
      - .:/app
      - /app/node_modules
    command: bun run lint:html

  lint-links:
    build:
      context: .
      dockerfile: Dockerfile.lint
    volumes:
      - .:/app
      - /app/node_modules
    command: bun run lint:links

  # Own image: pa11y-ci needs headless Chromium (see Dockerfile.a11y).
  lint-a11y:
    build:
      context: .
      dockerfile: Dockerfile.a11y
    volumes:
      - .:/app
      - /app/node_modules
    command: bun run lint:a11y

  test:
    build:
      context: .
      dockerfile: Dockerfile.lint
    volumes:
      - .:/app
      - /app/node_modules
    command: bun run test

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Dev: never cache, and avoid sendfile staleness on bind mounts (Docker Desktop).
    sendfile off;
    expires -1;
    add_header Cache-Control "no-store, must-revalidate" always;
    etag off;
    if_modified_since off;

    location /media/ {
        proxy_pass http://s3:8333/folio/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
        ssi on;
    }
}

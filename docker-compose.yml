services:
  webserver:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - s3

  s3:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data -ip=0.0.0.0
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data

  s3-init:
    build:
      context: ./s3-init
    depends_on:
      - s3
    volumes:
      - ./media-local:/media-local:ro

volumes:
  s3-data:

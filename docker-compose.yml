services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - seaweedfs

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data -ip=0.0.0.0
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs-data:/data

  seaweed-init:
    image: curlimages/curl:latest
    depends_on:
      - seaweedfs
    volumes:
      - ./seed:/seed:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        until curl -s -o /dev/null "http://seaweedfs:8333/"; do
          sleep 1
        done
        curl -s -X PUT "http://seaweedfs:8333/folio"
        curl -s -X PUT --data-binary @/seed/sample.svg \
          -H "Content-Type: image/svg+xml" \
          "http://seaweedfs:8333/folio/sample.svg"

volumes:
  seaweedfs-data:
